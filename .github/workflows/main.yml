name: Compilar APK ROCKOBOX PLUS TV (Android TV)

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK con Gradle
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ./RockoboxTV.apk

      - name: Subir RockoboxTV.apk listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RockoboxTV-APK-Instalador
          path: ./RockoboxTV.apk
